<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%" style="border-radius: 16px; overflow: hidden;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081329" />
      <stop offset="40%" stop-color="#0F2756" />
      <stop offset="100%" stop-color="#050C1A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A472" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <radialGradient id="glowTopRight" cx="85%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowBottomLeft" cx="15%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#00A472" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00A472" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="360" fill="url(#bgGrad)" />
  <rect width="1000" height="360" fill="url(#grid)" />
  <rect width="1000" height="360" fill="url(#glowTopRight)" />
  <rect width="1000" height="360" fill="url(#glowBottomLeft)" />

  <!-- Outer Border -->
  <rect x="2" y="2" width="996" height="356" rx="14" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- University / Faculty Eyebrow Badge -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="370" height="28" rx="14" fill="#D4AF37" fill-opacity="0.12" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="14" cy="14" r="5" fill="#FDE047" />
    <text x="28" y="18" fill="#FDE047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5">UNIVERSIDAD NACIONAL DEL ALTIPLANO</text>
  </g>

  <!-- Faculty & School Subtitle -->
  <text x="60" y="108" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="2">
    FACULTAD DE CIENCIAS DE LA EDUCACIÓN · EPEP
  </text>

  <!-- Main Title -->
  <text x="60" y="152" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
    IV CONGRESO INTERNACIONAL DE
  </text>
  <text x="60" y="196" fill="url(#goldGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
    INVESTIGACIÓN E INNOVACIÓN
  </text>

  <!-- Subtitle / Tagline -->
  <text x="60" y="235" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">
    Plataforma institucional de gestión de inscripciones, pagos con Págalo.pe, ponencias científicas y panel administrativo.
  </text>

  <!-- Decorative Separator -->
  <line x1="60" y1="262" x2="940" y2="262" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />

  <!-- Technology Badges -->
  <g transform="translate(60, 285)">
    <!-- Next.js 16 -->
    <g transform="translate(0, 0)">
      <rect width="112" height="32" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5" />
      <text x="56" y="20" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Next.js 16.3</text>
    </g>

    <!-- React 19 -->
    <g transform="translate(122, 0)">
      <rect width="98" height="32" rx="8" fill="#0F172A" stroke="#61DAFB" stroke-width="1" stroke-opacity="0.5" />
      <text x="49" y="20" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">React 19</text>
    </g>

    <!-- TypeScript -->
    <g transform="translate(230, 0)">
      <rect width="115" height="32" rx="8" fill="#0F172A" stroke="#3178C6" stroke-width="1" stroke-opacity="0.5" />
      <text x="57" y="20" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TypeScript 5</text>
    </g>

    <!-- Tailwind CSS 4 -->
    <g transform="translate(355, 0)">
      <rect width="130" height="32" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5" />
      <text x="65" y="20" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Tailwind CSS 4</text>
    </g>

    <!-- Supabase -->
    <g transform="translate(495, 0)">
      <rect width="110" height="32" rx="8" fill="#0F172A" stroke="#3ECF8E" stroke-width="1" stroke-opacity="0.5" />
      <text x="55" y="20" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Supabase</text>
    </g>

    <!-- Págalo.pe -->
    <g transform="translate(615, 0)">
      <rect width="115" height="32" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.5" />
      <text x="57" y="20" fill="#FDE047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Págalo.pe</text>
    </g>

    <!-- Status Badge -->
    <g transform="translate(740, 0)">
      <rect width="140" height="32" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1" stroke-opacity="0.7" />
      <circle cx="16" cy="16" r="4" fill="#34D399" />
      <text x="76" y="20" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Production Ready</text>
    </g>
  </g>
</svg>
